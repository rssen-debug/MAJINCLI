<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAJIN</title>
<style>
:root{--bg:#04070a;--bg2:#07101a;--bg3:#050b11;--ink:#bfeaf7;--dim:#6e8fa0;--cy:#57e6ff;--pink:#ff8fd0;--cysoft:rgba(87,230,255,.14);--ok:#6cf2b6;--warn:#ffd479;--bad:#ff7a7a;--line:#12303f;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace}
body.light{--bg:#f6f8fa;--bg2:#eef2f6;--bg3:#fff;--ink:#122430;--dim:#637683;--cy:#0f7f9c;--pink:#c9417f;--cysoft:rgba(15,127,156,.10);--ok:#0f7a4f;--warn:#8a5b00;--bad:#a92a2a;--line:#ccd8e0}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--mono);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
body.light::after{opacity:.25;background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 3px)}
#app{display:grid;grid-template-columns:214px 1fr 300px;min-height:0}
body.rail-off #app{grid-template-columns:0 1fr 300px}
body.pan-off #app{grid-template-columns:214px 1fr 0}
@media(max-width:960px){#app{grid-template-columns:1fr}#rail,#panel{display:none}}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:radial-gradient(120% 300% at 12% -60%,var(--cysoft),transparent 60%),var(--bg2)}
header h1{margin:0;font-size:13px;letter-spacing:.32em;color:var(--cy);text-shadow:0 0 12px rgba(87,230,255,.35)}
.logo{width:22px;height:22px;display:block;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(255,143,208,.45))}
.sub{color:var(--dim);font-size:11px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--dim);white-space:nowrap;background:rgba(127,127,127,.04)}
.chip b{color:var(--ink);font-weight:600}
.chip.live{color:var(--cy);border-color:var(--line)}
.spacer{flex:1}
button{font:12px var(--mono);color:var(--ink);background:rgba(127,180,200,.06);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--cy);background:var(--cysoft);color:var(--cy)}
button.on{border-color:var(--cy);color:var(--cy)}
button.danger{color:var(--bad);border-color:var(--bad)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#274250;vertical-align:1px;margin-right:5px}
.led.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bp 2.6s infinite}
.led.y{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:bp 1.1s infinite}
.led.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
@keyframes bp{50%{opacity:.45}}
#rail{border-right:1px solid var(--line);padding:10px;overflow:auto;background:var(--bg3)}
#rail h3,#panel h3{font-size:10px;letter-spacing:.22em;color:var(--dim);margin:14px 0 6px;font-weight:600}
#rail h3:first-child,#panel h3:first-child{margin-top:0}
.sess{padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess:hover{background:var(--bg2);color:var(--ink)}
.sess.act{background:var(--cysoft);color:var(--cy)}
.plan{font-size:11px}.plan div{padding:2px 0;color:var(--dim)}
.plan div.done{color:var(--dim);text-decoration:line-through}.plan div.doing{color:var(--cy)}.plan div.blocked{color:var(--bad)}
#main{display:grid;grid-template-rows:1fr;min-width:0;min-height:0}
#scroller{overflow:auto;padding:14px 18px 6px;scroll-behavior:smooth}
.msg{margin:0 0 12px;max-width:94%}.msg .who{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:3px}
.msg .body{white-space:pre-wrap;word-wrap:break-word}
.msg.user .body{color:var(--ink)}.msg.user .who{color:var(--dim)}
.msg.majin .body{border-left:1px solid var(--line);padding-left:11px}
.msg.sys .body{color:var(--dim);font-size:11.5px;border-left:1px dotted var(--line);padding-left:10px}
.msg.err .body{color:var(--bad);border-left:1px solid var(--bad);padding-left:11px}
.msg pre{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;overflow:auto;font-size:11.5px;white-space:pre-wrap}
.msg code{background:var(--bg2);padding:1px 4px;border-radius:4px}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}
.tl{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--dim);background:var(--bg2);cursor:pointer}
.tl.run{color:var(--cy);border-color:var(--cy)}.tl.bad{color:var(--bad);border-color:var(--bad)}.tl.good{color:var(--ok)}
.tl .ms{opacity:.6;margin-left:5px}
.trace{display:none;margin:6px 0 0;border:1px solid var(--line);border-radius:7px;background:var(--bg2);padding:8px 10px;font-size:11.5px;white-space:pre-wrap;max-height:340px;overflow:auto}
.trace.open{display:block}
.foot{font-size:10.5px;color:var(--dim);margin-top:5px}
.gauge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--cy)}
.bar{width:64px;height:4px;background:var(--bg2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pink))}
.caret::after{content:"▍";color:var(--cy);animation:bp 1s infinite}
.appr{border:1px solid var(--warn);background:var(--bg2);border-radius:8px;padding:9px 11px;margin:8px 0}
.appr h4{margin:0 0 4px;font-size:12px;color:var(--warn)}
#panel{border-left:1px solid var(--line);padding:10px;overflow:auto;background:var(--bg3);min-width:0}
.row{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:11.5px}
.row span{color:var(--dim);min-width:74px}
select,input,textarea{font:11.5px var(--mono);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 8px var(--cysoft)}
.kv{font-size:11px;color:var(--dim)}.kv b{color:var(--ink);font-weight:600}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:4px}
.spark i{flex:1;background:var(--cy);opacity:.55;border-radius:1px;min-height:2px}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:8px 14px 10px}
#composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
#input{width:100%;min-height:38px;max-height:240px;resize:vertical;padding:9px 11px;font:13px var(--mono);color:var(--ink);background:var(--bg3);border:1px solid var(--line);border-radius:9px}
#input:focus{border-color:var(--cy);box-shadow:0 0 16px var(--cysoft)}
.crow{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.crow .grow{flex:1}
#send{padding:8px 16px;border-radius:9px;font-size:12px;letter-spacing:.1em}
#send.busy{color:var(--bad);border-color:var(--bad)}
.drop{border:1px dashed var(--cy);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--dim)}
.drop.hot{background:var(--cysoft);color:var(--cy)}
#toast{position:fixed;right:14px;bottom:74px;display:grid;gap:6px;z-index:9}
#toast div{border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:7px 10px;font-size:11.5px;box-shadow:0 6px 24px #000a;animation:fade 5s forwards}
@keyframes fade{0%,72%{opacity:1}100%{opacity:0}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 64 64" aria-label="MAJIN" role="img">
    <path d="M32 3C17 3 7 13 7 27c0 10 5 17 12 22 4 3 7 6 7 11h12c0-5 3-8 7-11 7-5 12-12 12-22C57 13 47 3 32 3Z" fill="currentColor" opacity=".14"/>
    <path d="M18 46V20c0-2 3-3 4-1l10 17 10-17c1-2 4-1 4 1v26" fill="none" stroke="#0a0a0a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 46V20c0-2 3-3 4-1l10 17 10-17c1-2 4-1 4 1v26" fill="none" stroke="#ff8fd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <circle cx="24" cy="16" r="2.6" fill="#ff8fd0"/><circle cx="40" cy="16" r="2.6" fill="#ff8fd0"/>
  </svg>
  <h1 id="brand">MAJIN</h1>
  <span class="sub" id="tagline"></span>
  <span class="chip" id="c-route">route <b>–</b></span>
  <span class="chip" id="c-moa">MOA <b>–</b></span>
  <span class="chip" id="c-tools">tools <b>–</b></span>
  <span class="chip" id="c-cost">$<b>0</b></span>
  <span class="spacer"></span>
  <span class="chip" id="c-tg"><i class="led" id="led-tg"></i>telegram</span>
  <span class="chip" id="c-wa"><i class="led" id="led-wa"></i>whatsapp</span>
  <button id="b-mode" title="Permission mode: Assist asks nothing, Approval asks for risky work, Full Auto runs everything">approval</button>
  <button id="b-panel" class="on" title="Side panel">⌗</button>
  <button id="b-rail" title="Sidebar">☰</button>
  <button id="b-theme" title="Light / dark">◐</button>
  <button id="b-voice" title="Read answers aloud">🔊</button>
  <button id="b-test" title="Run self-test">◎</button>
  <button id="b-stop" class="danger" title="Emergency stop — abort the running task">■</button>
</header>

<div id="app">
  <div id="rail">
    <h3>SESSIONS</h3><div id="sessions"></div>
    <h3>PLAN</h3><div class="plan" id="plan"><div>–</div></div>
    <h3>SCHEDULE</h3><div id="sched" class="kv">no jobs</div>
    <h3>MEMORY</h3><div id="mem" class="kv">–</div>
  </div>
  <div id="main"><div id="scroller"></div></div>
  <div id="panel">
    <h3>ROUTING</h3><div id="routes"></div>
    <h3>MOA</h3><div id="moactl"></div>
    <h3>PERMISSIONS</h3><div id="guardctl"></div>
    <h3>PROVIDERS</h3><div id="providers"></div>
    <h3>CHANNELS</h3><div id="chan"></div>
    <h3>RE</h3><div id="rebox">
      <div class="row"><input id="re-path" placeholder="path to a file" style="flex:1" /><button id="re-go">analyze</button></div>
      <div id="re-out" class="kv">drop a file on the composer to analyze it</div>
    </div>
    <h3>COST</h3><div id="usage" class="kv"></div>
  </div>
</div>

<footer>
  <div id="composer">
    <textarea id="input" placeholder="Ask MAJIN to do something …  type / for commands" rows="1"></textarea>
    <button id="send">RUN</button>
  </div>
  <div class="crow">
    <button id="mic" title="Voice input">🎙</button><span id="mic-state"></span>
    <span class="grow" id="status">ready</span>
    <span id="drop" class="drop">drop a file → RE analysis</span>
  </div>
</footer>
<div id="toast"></div>
<script>window.__MAJIN_TOKEN__='__MAJIN_TOKEN__';window.__MAJIN_VERSION__='__MAJIN_VERSION__';</script>
<script src="/app.js"></script>
<script src="/panels.js"></script>
</body>
</html>
