<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LENT</title>
<style>
:root{--bg:#04070a;--bg2:#07101a;--ink:#bfeaf7;--dim:#6e8fa0;--cy:#57e6ff;--cysoft:rgba(87,230,255,.14);--ok:#6cf2b6;--warn:#ffd479;--bad:#ff7a7a;--line:#12303f;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--mono);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
#app{display:grid;grid-template-columns:214px 1fr 300px;min-height:0}
body.rail-off #app{grid-template-columns:0 1fr 300px}
body.pan-off #app{grid-template-columns:214px 1fr 0}
@media(max-width:960px){#app{grid-template-columns:1fr}#rail,#panel{display:none}}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:radial-gradient(120% 300% at 12% -60%,rgba(87,230,255,.16),transparent 60%),var(--bg2)}
header h1{margin:0;font-size:13px;letter-spacing:.32em;color:var(--cy);text-shadow:0 0 12px rgba(87,230,255,.55)}
.sub{color:var(--dim);font-size:11px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--dim);white-space:nowrap;background:rgba(255,255,255,.015)}
.chip b{color:var(--ink);font-weight:600}
.chip.live{color:var(--cy);border-color:#1d5c72}
.spacer{flex:1}
button{font:12px var(--mono);color:var(--ink);background:rgba(87,230,255,.05);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button:hover{border-color:#2b7c99;background:rgba(87,230,255,.12);color:#eafcff}
button.on{border-color:#2fb4d6;color:var(--cy)}
button.danger{color:var(--bad);border-color:#4d2430}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#274250;vertical-align:1px;margin-right:5px}
.led.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bp 2.6s infinite}
.led.y{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:bp 1.1s infinite}
.led.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
@keyframes bp{50%{opacity:.45}}
#rail{border-right:1px solid var(--line);padding:10px;overflow:auto;background:#050b11}
#rail h3,#panel h3{font-size:10px;letter-spacing:.22em;color:var(--dim);margin:14px 0 6px;font-weight:600}
#rail h3:first-child,#panel h3:first-child{margin-top:0}
.sess{padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess:hover{background:#0a1620;color:var(--ink)}
.sess.act{background:var(--cysoft);color:#dffaff}
.plan{font-size:11px}.plan div{padding:2px 0;color:var(--dim)}
.plan div.done{color:#4a6c7a;text-decoration:line-through}.plan div.doing{color:var(--cy)}.plan div.blocked{color:var(--bad)}
#main{display:grid;grid-template-rows:1fr;min-width:0;min-height:0}
#scroller{overflow:auto;padding:14px 18px 6px;scroll-behavior:smooth}
.msg{margin:0 0 12px;max-width:94%}.msg .who{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:3px}
.msg .body{white-space:pre-wrap;word-wrap:break-word}
.msg.user .body{color:#eaf9ff}.msg.user .who{color:#52809a}
.msg.lent .body{border-left:1px solid #14384d;padding-left:11px}
.msg.sys .body{color:var(--dim);font-size:11.5px;border-left:1px dotted #1d3d4d;padding-left:10px}
.msg.err .body{color:var(--bad);border-left:1px solid #4d2430;padding-left:11px}
.msg pre{background:#071219;border:1px solid var(--line);border-radius:7px;padding:8px 10px;overflow:auto;font-size:11.5px;white-space:pre-wrap}
.msg code{background:#0b1a24;padding:1px 4px;border-radius:4px}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}
.tl{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--dim);background:#07121a;cursor:pointer}
.tl.run{color:var(--cy);border-color:#1d5c72}.tl.bad{color:var(--bad);border-color:#4d2430}.tl.good{color:#58b995}
.tl .ms{opacity:.6;margin-left:5px}
.trace{display:none;margin:6px 0 0;border:1px solid var(--line);border-radius:7px;background:#060f16;padding:8px 10px;font-size:11.5px;white-space:pre-wrap;max-height:340px;overflow:auto}
.trace.open{display:block}
.foot{font-size:10.5px;color:var(--dim);margin-top:5px}
.gauge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--cy)}
.bar{width:64px;height:4px;background:#0d2531;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1d7c95,var(--cy))}
.caret::after{content:"▍";color:var(--cy);animation:bp 1s infinite}
.appr{border:1px solid #7a5b1e;background:#140f04;border-radius:8px;padding:9px 11px;margin:8px 0}
.appr h4{margin:0 0 4px;font-size:12px;color:var(--warn)}
#panel{border-left:1px solid var(--line);padding:10px;overflow:auto;background:#050b11;min-width:0}
.row{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:11.5px}
.row span{color:var(--dim);min-width:74px}
select,input,textarea{font:11.5px var(--mono);color:var(--ink);background:#081420;border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2b7c99;box-shadow:0 0 8px rgba(87,230,255,.14)}
.kv{font-size:11px;color:var(--dim)}.kv b{color:var(--ink);font-weight:600}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:4px}
.spark i{flex:1;background:#125061;border-radius:1px;min-height:2px}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:8px 14px 10px}
#composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
#input{width:100%;min-height:38px;max-height:240px;resize:vertical;padding:9px 11px;font:13px var(--mono);color:#eafcff;background:#06111a;border:1px solid var(--line);border-radius:9px}
#input:focus{border-color:#2b7c99;box-shadow:0 0 16px rgba(87,230,255,.12)}
.crow{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.crow .grow{flex:1}
#send{padding:8px 16px;border-radius:9px;font-size:12px;letter-spacing:.1em}
#send.busy{color:var(--bad);border-color:#4d2430}
.drop{border:1px dashed #1d5c72;border-radius:8px;padding:4px 8px;font-size:11px;color:var(--dim)}
.drop.hot{background:var(--cysoft);color:var(--cy)}
#toast{position:fixed;right:14px;bottom:74px;display:grid;gap:6px;z-index:9}
#toast div{border:1px solid var(--line);background:#08161f;border-radius:8px;padding:7px 10px;font-size:11.5px;box-shadow:0 6px 24px #000a;animation:fade 5s forwards}
@keyframes fade{0%,72%{opacity:1}100%{opacity:0}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#12303f;border-radius:9px}
</style>
</head>
<body>
<header>
  <h1 id="brand">LENT</h1>
  <span class="sub" id="tagline"></span>
  <span class="chip" id="c-route">route <b>–</b></span>
  <span class="chip" id="c-moa">MOA <b>–</b></span>
  <span class="chip" id="c-tools">tools <b>–</b></span>
  <span class="chip" id="c-cost">$<b>0</b></span>
  <span class="spacer"></span>
  <span class="chip" id="c-tg"><i class="led" id="led-tg"></i>telegram</span>
  <span class="chip" id="c-wa"><i class="led" id="led-wa"></i>whatsapp</span>
  <button id="b-panel" class="on" title="Panel">⌗</button>
  <button id="b-rail" title="Sidofält">☰</button>
  <button id="b-voice" title="Läs upp svar">🔊</button>
  <button id="b-test" title="Selftest">◎</button>
</header>

<div id="app">
  <div id="rail">
    <h3>SESSIONER</h3><div id="sessions"></div>
    <h3>PLAN</h3><div class="plan" id="plan"><div>–</div></div>
    <h3>SCHEMA</h3><div id="sched" class="kv">inga jobb</div>
    <h3>MINNE</h3><div id="mem" class="kv">–</div>
  </div>
  <div id="main"><div id="scroller"></div></div>
  <div id="panel">
    <h3>ROUTING</h3><div id="routes"></div>
    <h3>MOA</h3><div id="moactl"></div>
    <h3>GUARD</h3><div id="guardctl"></div>
    <h3>PROVIDERS</h3><div id="providers"></div>
    <h3>KANALER</h3><div id="chan"></div>
    <h3>RE</h3><div id="rebox">
      <div class="row"><input id="re-path" placeholder="sökväg till fil" style="flex:1" /><button id="re-go">ana</button></div>
      <div id="re-out" class="kv">släpp en fil i matradet för analys</div>
    </div>
    <h3>KOSTNAD</h3><div id="usage" class="kv"></div>
  </div>
</div>

<footer>
  <div id="composer">
    <textarea id="input" placeholder="Be LENT göra något …  / för kommandon" rows="1"></textarea>
    <button id="send">KÖR</button>
  </div>
  <div class="crow">
    <button id="mic" title="Röstinmatning">🎙</button><span id="mic-state"></span>
    <span class="grow" id="status">redo</span>
    <span id="drop" class="drop">släpp fil → RE-analys</span>
  </div>
</footer>
<div id="toast"></div>
<script>window.__LENT_TOKEN__='__LENT_TOKEN__';window.__LENT_VERSION__='__LENT_VERSION__';</script>
<script src="/app.js"></script>
<script src="/panels.js"></script>
</body>
</html>
