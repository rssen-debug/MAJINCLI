name: MAJIN browser missing URL recovery acceptance
on:
  push:
    branches: [fix/browser-open-explicit-goal-url-recovery-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-target:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/core/loop.js
      - run: node --test test/browser-open-goal-url-recovery.test.js
      - run: npm test
      - run: npm run check
