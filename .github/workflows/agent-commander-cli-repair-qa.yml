name: MAJIN no-dependency CLI auto-repair regression
on:
  push:
    branches: [fix/agent-legacy-commander-cli-auto-repair-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-repair:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/core/goal-artifact.js
      - run: node --check src/core/loop.js
      - run: node --test test/agent-repair-commander-cli.test.js
      - run: npm test
      - run: npm run check
