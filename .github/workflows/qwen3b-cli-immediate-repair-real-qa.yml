name: MAJIN actual Qwen3B CLI agent repair after syntax feedback
on:
  push:
    branches: [qa/qwen3b-cli-immediate-repair-latest-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '05'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and prepare offline CLI execution sandbox
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          docker pull node:22-alpine
      - name: Boot genuine FREE local Qwen3B
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-cli-repair.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Actual agent turn must create executable JS responding to TWO arguments
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee cli-agent-console.log
      - name: Preserve actual executable, tool trace and Docker results
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-qwen3b-cli-exec-two-inputs
          path: |
            qa-evidence/
            qa-workspace/
            cli-agent-console.log
          retention-days: 30
          if-no-files-found: warn
