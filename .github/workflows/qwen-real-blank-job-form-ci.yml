name: MAJIN genuine Qwen3B blank job form acceptance
on:
  push:
    branches: [qa/qwen-blank-job-form-required-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-local-form:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '10'
      QA_FORM_EMPTY_REQUIRED: '1'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install MAJIN and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/qa/prompt-battery.mjs
          npx playwright install chromium
      - name: Start REAL free Qwen3B via local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-blank-form.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Model must fill BLANK job ID, check consent, and submit real local POST
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee qa-blank-form.log
      - name: Preserve actual form and tool traces even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-qwen3b-blank-job-form-proof
          path: |
            qa-evidence/
            qa-blank-form.log
          if-no-files-found: warn
          retention-days: 30
