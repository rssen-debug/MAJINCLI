name: MAJIN latest real Qwen3B CLI browser and fake form QA
on:
  push:
    branches: [qa/qwen3b-cli-browser-form-after-151-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-tool-use:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '05,09,10'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install actual CLI and Chromium test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          node --check scripts/qa/prompt-battery.mjs
          node --check scripts/qa/fixture-teardown.mjs
          npx playwright install chromium
          docker pull node:22-alpine
      - name: Start actual FREE Qwen2.5 3B through local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-real-browser-safe.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Real 05 executable CLI, 09 PNG, 10 consent+HTTP receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee live-qa-console.log
      - name: Preserve evidence even on failure
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - name: Upload real model per-case traces and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3b-cli-browser-form-qa
          path: |
            qa-evidence/
            qa-workspace/
            live-qa-console.log
          retention-days: 30
          if-no-files-found: warn
