name: MAJIN real Qwen3B CLI after mixed-ESM repair
on:
  push:
    branches: [qa/qwen3b-cli-post-esm-repair-176-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '05'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production MAJIN and isolated Docker CLI runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          docker pull node:22-alpine
      - name: Start actual free Ollama Qwen3B
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-qwen-cli-argv.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Real model makes JS CLI and Docker checks two different responses
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee qa-cli.log
      - name: Preserve all artifacts including red run
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - name: Upload real LLM traces, generated JS and strict verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3b-argv-cli-independent-evidence
          path: |
            qa-evidence/
            qa-workspace/
            qa-cli.log
          retention-days: 30
          if-no-files-found: warn
