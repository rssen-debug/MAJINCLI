name: MAJIN real free-model prompt battery

on:
  push:
    branches: [qa/real-free-model-prompt-battery-20261020]
    paths:
      - scripts/qa/prompt-battery.mjs
      - .github/workflows/prompt-battery-free-llm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-prompt-battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-prompts:
    name: Real MAJIN prompts - ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: qwen05
            model: qwen2.5:0.5b
          - label: qwen15
            model: qwen2.5:1.5b
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      QA_MODEL: ${{ matrix.model }}
      MAJIN_QA_SANDBOX: '1'
      MAJIN_LLM_TIMEOUT: '55000'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS tools and available browser
        run: |
          npm ci --no-fund --no-audit
          node --check scripts/qa/prompt-battery.mjs
          npx playwright install chromium
      - name: Start real local free LLM, no API keys
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-majin-qa.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "Real locally served model: $QA_MODEL"
      - name: Create sandbox environment
        shell: bash
        run: |
          set -euo pipefail
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-real-prompt.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/prompt-battery-evidence" >> "$GITHUB_ENV"
      - name: Execute MAJIN production agent and verdict battery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee prompt-battery-console.log
      - name: Upload real prompt results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-battery-${{ matrix.label }}
          path: |
            prompt-battery-evidence/
            prompt-battery-console.log
          retention-days: 30
          if-no-files-found: warn
