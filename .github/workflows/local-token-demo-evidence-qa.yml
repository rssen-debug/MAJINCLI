name: MAJIN local token demo file proof
on:
  push:
    branches: [fix/local-token-demo-independent-completion-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-demo-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/core/goal-artifact.js
      - run: node --check src/core/loop.js
      - run: node --test test/agent-local-token-demo-completion.test.js
      - run: npm test
      - run: npm run check
