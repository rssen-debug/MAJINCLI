name: MAJIN real Qwen3B job context after verification fixes
on:
  push:
    branches: [qa/qwen3b-job-context-after-repairs-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-job-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '06,07'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install MAJIN
        run: npm ci --no-audit --no-fund
      - name: Start real free model and temp sandbox
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-job-ret.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Reproduce real job shortlist and SAME conversation follow-up
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee job-ret-test.log
      - name: Upload actual independent evidence and saved files
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-job-context-qwen3b
          path: |
            qa-evidence/
            qa-workspace/
            job-ret-test.log
          if-no-files-found: warn
          retention-days: 30
