name: MAJIN full 11 real Qwen3B tasks post 178
on:
  push:
    branches: [qa/full-eleven-free-qwen-post-178-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen3b-sharded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: core-build
            cases: '01,04,05'
          - label: file-operations
            cases: '01,02,03'
          - label: job-continuity
            cases: '06,07'
          - label: browser-receipt
            cases: '09,10'
          - label: research-crypto-demo
            cases: '08,11'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: ${{ matrix.cases }}
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          node --check scripts/qa/prompt-battery.mjs
      - name: Install Chromium only for browser shard
        if: ${{ matrix.label == 'browser-receipt' }}
        shell: bash
        run: npx playwright install chromium
      - name: Install real free model and isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-shard.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Run real MAJIN user prompts with independent evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee task-console.log
      - name: Summarize independently verified outcomes
        if: always()
        shell: bash
        run: |
          if [ -f qa-evidence/prompt-battery.json ]; then
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("qa-evidence/prompt-battery.json","utf8"));let s="## "+x.model+" sharded QA\n\n| Task | Result | Evidence |\n|---|---|---|\n";for(const t of x.cases)s+="| "+t.id+" "+t.category+" | "+t.status+" | "+String(t.reason).replace(/\|/g,"/").slice(0,160)+" |\n";s+="\n"+JSON.stringify(x.summary)+"\n";fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);'
          else
            echo "NO RESULT — NOT TESTED; task runner did not finish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Snapshot only isolated QA fixtures
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p sandbox-outputs
            cp -r "$MAJIN_HOME/workspace/." sandbox-outputs/ || true
          fi
      - name: Upload JSON traces and actual files, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.label }}
          path: |
            qa-evidence/
            sandbox-outputs/
            task-console.log
          retention-days: 30
          if-no-files-found: warn
