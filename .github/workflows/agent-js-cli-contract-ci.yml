name: MAJIN agent JS CLI artifact contract gate
on:
  push:
    branches: [fix/agent-js-cli-contract-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --test test/goal-artifact-js-cli.test.js test/goal-artifact.test.js test/agent-path-pinning.test.js
      - run: npm test
      - run: npm run check
