name: MAJIN live free-LLM job and browser acceptance
on:
  push:
    branches: [qa/live-jobs-browser-free-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-agent-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: qwen05
            model: qwen2.5:0.5b
          - label: qwen15
            model: qwen2.5:1.5b
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MAJIN_QA_SANDBOX: '1'
      QA_ONLY: '06,07,09,10'
      QA_MODEL: ${{ matrix.model }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install fixtures, chromium and local free model
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/qa/prompt-battery.mjs
          npx playwright install chromium
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-job-browser.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-results" >> "$GITHUB_ENV"
      - name: Run real job-memory and local-browser tasks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee real-agent.log
      - name: Capture local fixture outputs (including screenshots)
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-output
            cp -r "$MAJIN_HOME/workspace/." qa-output/ || true
          fi
      - name: Upload detailed case evidence on failures too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-browser-${{ matrix.label }}
          path: |
            qa-results/
            qa-output/
            real-agent.log
          retention-days: 30
          if-no-files-found: warn
