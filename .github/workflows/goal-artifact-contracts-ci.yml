name: MAJIN real artifact contract regression
on:
  push:
    branches: [fix/agent-artifact-contracts-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --check src/core/goal-artifact.js
      - run: node --check src/core/loop.js
      - run: node --test test/goal-artifact.test.js
      - run: npm test
      - run: npm run check
