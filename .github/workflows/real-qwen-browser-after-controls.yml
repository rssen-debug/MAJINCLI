name: MAJIN real Qwen browser form and screenshot after selector fix
on:
  push:
    branches: [qa/real-qwen-browser-controls-post-fix-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      MAJIN_QA_SANDBOX: '1'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '09,10'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install real browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/qa/prompt-battery.mjs
          npx playwright install chromium
      - name: Start free Ollama Qwen3B and isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-browserpost.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Run real Chromium screenshot + local-only consent/application form
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee browser-post-qa.log
      - name: Preserve actual screenshots and form result evidence on failure
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - name: Upload per-case traces and screenshots even if red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-qwen3b-browser-after-controls-fix
          path: |
            qa-evidence/
            qa-workspace/
            browser-post-qa.log
          retention-days: 30
          if-no-files-found: warn
