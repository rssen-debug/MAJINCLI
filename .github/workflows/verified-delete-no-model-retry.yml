name: MAJIN independently verified file deletion needs no second model call
on:
  push:
    branches: [fix/verified-single-delete-stop-after-tool-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-delete:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/core/loop.js
      - run: node --check src/core/goal-artifact.js
      - run: node --test test/verified-single-delete.test.js
      - run: npm test
      - run: npm run check
