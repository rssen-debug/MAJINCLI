name: Agent HTML CTA contract cross-platform QA
on:
  push:
    branches: [fix/agent-styled-cta-verification-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/goal-artifact-styled-cta.test.js test/goal-artifact.test.js
      - run: npm test
      - run: npm run check
