name: MAJIN V4 CI

on:
  push:
    branches: [v4/main]
  pull_request:
    branches: [v4/main]

permissions:
  contents: read

concurrency:
  group: v4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: V4 test suite
        run: npm run v4:test
      - name: Acceptance matrix integrity (weights = 100, evidence required)
        run: npm run v4:progress -- --check
      - name: Host doctor (must not report a blocking failure)
        run: node scripts/v4/host-doctor.mjs --json
        env:
          MAJIN_HOME: ${{ runner.temp }}/majin-ci
      - name: Parse all sources
        run: npm run check
      - name: No stray non-English literals in shipped code
        run: npm run i18n
