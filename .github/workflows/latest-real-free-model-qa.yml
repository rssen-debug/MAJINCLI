name: MAJIN verified latest agent - real free LLM QA
on:
  push:
    branches: [qa/latest-agent-live-free-model-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-prompt-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tiny
            model: qwen2.5:0.5b
          - label: small
            model: qwen2.5:1.5b
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      MAJIN_QA_SANDBOX: '1'
      QA_ONLY: '01,04,05'
      QA_MODEL: ${{ matrix.model }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare real model and sandbox
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          node --check scripts/qa/prompt-battery.mjs
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          docker pull node:22-alpine
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-smoke.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/smoke-evidence" >> "$GITHUB_ENV"
      - name: Execute actual MAJIN agent (no mock LLM)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee smoke-console.log
      - name: Snapshot isolated fixture workspace for debugging
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-sandbox-output
            cp -r "$MAJIN_HOME/workspace/." qa-sandbox-output/ || true
          fi
      - name: Preserve every independent outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-agent-${{ matrix.label }}
          path: |
            smoke-evidence/
            smoke-console.log
            qa-sandbox-output/
          if-no-files-found: warn
          retention-days: 30
