name: MAJIN ordered browser and stateful tools QA
on:
  push:
    branches: [fix/ordered-browser-and-stateful-tools-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tool-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/ordered-stateful-tools.test.js
      - run: npm test
      - run: npm run check
