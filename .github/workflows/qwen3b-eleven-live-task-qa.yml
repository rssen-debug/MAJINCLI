name: MAJIN Qwen3B 11 real sandbox tasks
on:
  push:
    branches: [qa/qwen3b-eleven-real-tasks-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-agent-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAJIN_QA_SANDBOX: '1'
      CI: 'true'
      QA_MODEL: qwen2.5:3b
      QA_ONLY: '01,02,03,04,05,06,07,08,09,10,11'
      MAJIN_LLM_LOCAL_TIMEOUT: '75000'
      MAJIN_LLM_TIMEOUT: '75000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application and sandbox dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/qa/prompt-battery.mjs
          npx playwright install chromium
          docker pull node:22-alpine
      - name: Download real free local model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/majin-ollama.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$QA_MODEL"
          echo "MAJIN_HOME=$(mktemp -d /tmp/majin-full-real.XXXXXXXX)" >> "$GITHUB_ENV"
          echo "QA_EVID=$GITHUB_WORKSPACE/qa-evidence" >> "$GITHUB_ENV"
      - name: Eleven independent real MAJIN agent outcomes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/prompt-battery.mjs 2>&1 | tee real-battery.log
      - name: Preserve isolated test outputs and screenshots
        if: always()
        shell: bash
        run: |
          if [ -n "${MAJIN_HOME:-}" ] && [ -d "$MAJIN_HOME/workspace" ]; then
            mkdir -p qa-workspace
            cp -r "$MAJIN_HOME/workspace/." qa-workspace/ || true
          fi
      - name: Upload per-task traces even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3b-real-eleven-outcomes
          path: |
            qa-evidence/
            qa-workspace/
            real-battery.log
          retention-days: 30
          if-no-files-found: warn
