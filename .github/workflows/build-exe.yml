name: build-exe

# Bygger den fristående MAJIN-binären (.exe för Windows) och lägger den som artifact.
# Kör manligen via Actions → Build exe, eller pusha en tag v* för en release med filen.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write     # bara säreporteringen behover detta: ett issue med loggen, sa att
                     # ett fel ga att lasa aven nar logg-slutpunkten ar otillganglig   # behövs för att softprops/action-gh-release ska kunna skapa releasen med .exe:n

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned, not "22": @yao-pkg/pkg needs a prebuilt node host binary from
          # pkg-fetch for the exact runner version. The runner's floating 22.x (we
          # hit 22.23.3) has none, and then pkg tries to compile Node from source
          # on Windows and dies. 22.23.2 is the newest minor pkg-fetch ships.
          node-version: 22.23.2
      - name: install (esbuild + pkg)
        run: npm ci
      - name: bundle and package
        # De sista raderna loggas som annotationer vid fel — utan det ar ett
        # ront steg hit intet att lasa (loggrarnas vard ar blockad for oss).
        run: |
          node scripts/build-exe.mjs 2>&1 | Tee-Object -FilePath build.log | Out-String -Stream | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 8 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          if (-not (Test-Path dist/majin-win-x64.exe)) {
            Get-Content build.log -Tail 14 | ForEach-Object { Write-Output "::error::no exe: $_" }
            exit 1
          }
      - name: smoke test the built binary
        # Endast `version` far falla bygget: det ar beviset for att den fristande
        # exe:n startar. doctor lamnar 1 nar ingen API-nyckel finns (och skriver
        # ✔/✖-tecken), sa dar är raderna information som loggas som varningar —
        # de syns i lönen utan att behöva logg-sidan, och de stoppar inte release.
        run: |
          $ErrorActionPreference = 'Continue'
          $v = & ./dist/majin-win-x64.exe version 2>&1
          $vc = $LASTEXITCODE
          "version (exit $vc): $v"
          if ($vc -ne 0) {
            ($v | Select-Object -Last 6) | ForEach-Object { Write-Output "::error::binary does not run: $_" }
            exit 1
          }
          $d = & ./dist/majin-win-x64.exe doctor 2>&1
          $dc = $LASTEXITCODE
          "doctor (exit $dc):"
          $d | ForEach-Object { "  $_" }
          if ($dc -ne 0) { ($d | Where-Object { "$_" -like '*X *' } | Select-Object -First 6) | ForEach-Object { Write-Output "::warning::doctor (no api key in CI): $_" } }
          $c = & ./dist/majin-win-x64.exe config get name 2>&1
          "config get name (exit $LASTEXITCODE): $c"
          exit 0
      - name: report the failure log as an issue
        # Logg-endpointen for actions ar inte alltid naabar; ett issue med de sista
        # raderna kan lasas med 'gh issue view' och gor blindfelsokning omoglig.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $f = [char]96 * 3
          if (Test-Path build.log) { $log = (Get-Content build.log -Tail 60) -join "`n" } else { $log = "(no build.log)" }
          $body = "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`n$f`n$log`n$f`n"
          $payload = @{ title = "build-exe failed on $($env:GITHUB_SHA.Substring(0,7))"; body = $body; labels = @('ci') } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } -Body $payload | ForEach-Object { "opened $($_.html_url)" }
      - uses: actions/upload-artifact@v4
        with:
          name: majin-win-x64
          path: dist/majin-win-x64.exe
          if-no-files-found: error
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/majin-win-x64.exe
          name: MAJIN ${{ github.ref_name }} (Windows x64)
          generate_release_notes: true
