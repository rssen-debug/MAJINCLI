name: build-exe

# Bygger den fristående MAJIN-binären (.exe för Windows) och lägger den som artifact.
# Kör manligen via Actions → Build exe, eller pusha en tag v* för en release med filen.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (esbuild + pkg)
        run: npm ci
      - name: bundle and package
        run: node scripts/build-exe.mjs
      - name: smoke test the built binary
        run: |
          ./dist/majin-win-x64.exe version
          ./dist/majin-win-x64.exe doctor
      - uses: actions/upload-artifact@v4
        with:
          name: majin-win-x64
          path: dist/majin-win-x64.exe
          if-no-files-found: error
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/majin-win-x64.exe
