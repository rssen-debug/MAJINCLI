name: win-qa-realworld

# REAL-WORLD AUTONOMOUS QA AUDIT (owner directive 2026-10-20):
# an independent QA lane that audits the ACTUAL PUBLISHED v1.0.0 product —
# never the repo code — on real windows-latest runners:
#   published release → sha256 → silent Inno install → real installed exe →
#   real local LLM (Ollama smollm2:135m / llama3.2:1b) → 29 honest scenarios →
#   per-scenario evidence JSON + transcripts → aggregated qa-report.json.
# Classification contract: everything here is at most VERIFIED_CI (a GitHub
# hosted runner is a Session-0 service without an interactive desktop).
# Any FAILED scenario turns the run RED on purpose: red with evidence is the
# audit's way of saying "this does not work — fix it", not a CI flake.

on:
  push:
    branches: ['qa/**']
  workflow_dispatch:
    inputs:
      qa_interactive:
        description: 'runner has an interactive desktop session (self-hosted)'
        required: false
        default: 'false'
        type: string
      models:
        description: 'Ollama models to pull (csv)'
        required: false
        default: 'smollm2:135m,qwen2.5:0.5b,llama3.2:1b'
        type: string
      runner:
        description: 'hosted = GitHub windows-latest (Session-0, sanningsspar för API/kontrakt) | self-hosted = interaktivón desktop i eget nät (control-c02/u-serier kan mäta)'
        required: false
        default: 'hosted'
        type: choice
        options: [hosted, self-hosted]
      source:
        description: 'published = test the release users get · branch-build = build+install THIS ref (repair loop)'
        required: false
        default: 'published'
        type: choice
        options: ['published', 'branch-build']
permissions:
  contents: read

jobs:
  qa-realworld:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the installer from THIS ref (branch-build lane)
        if: github.event.inputs.source == 'branch-build' || (github.event_name == 'push' && 'false' == 'true')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qa-stage | Out-Null
          npm ci | Out-Null
          python -m pip install --quiet ziglang
          # ORDNINGEN ÄR KRITISK (mätt 2026-10-20, run 39421716141): build-exe.mjs
          # rmSync:ar allt utom bundle-step.cjs/node-sea i dist/ — ett setup.exe
          # byggt FÖRE dör där. Därför: exe först, setup sist.
          node scripts/build-exe.mjs *>&1 | Tee-Object -FilePath build.log
          # MÄTT (run 39422866759): dist/setup/majin-setup.exe är ZIG-laddaren, inte Inno,
          # och avvisar Inno-flaggor. Konsumentartefakten = build-installer.mjs (Inno).
          choco install innosetup -y --no-progress | Select-Object -Last 2
          node scripts/build-installer.mjs *>&1 | Tee-Object -FilePath installer.log
          if (-not (Test-Path dist/installer/MAJIN-Setup.exe)) { Get-Content installer.log -Tail 20 -ErrorAction SilentlyContinue; throw "branch build produced no Inno installer" }
          Copy-Item dist/installer/MAJIN-Setup.exe qa-stage\MAJIN-Setup.exe
          $h = (Get-FileHash qa-stage\MAJIN-Setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content qa-stage\MAJIN-Setup.exe.sha256 $h
          "branch-built installer sha256=$h ($((Get-Item qa-stage\MAJIN-Setup.exe).Length) bytes) @ $env:GITHUB_SHA"

      - name: Download PUBLISHED v1.0.0 release artifacts (we test what users get)
        if: github.event.inputs.source != 'branch-build'
        shell: pwsh
        run: |
          $rel = 'https://github.com/rssen-debug/MAJINCLI/releases/download/v1.0.0'
          New-Item -ItemType Directory -Force qa-stage | Out-Null
          Invoke-WebRequest "$rel/MAJIN-Setup.exe"        -OutFile qa-stage\MAJIN-Setup.exe
          Invoke-WebRequest "$rel/MAJIN-Setup.exe.sha256" -OutFile qa-stage\MAJIN-Setup.exe.sha256
          (Get-Item qa-stage\MAJIN-Setup.exe).Length

      - name: Share the branch-built installer with the UI lane
        if: ${{ github.event.inputs.source == 'branch-build' }}
        uses: actions/upload-artifact@v4
        with:
          name: branch-installer
          path: dist/installer/MAJIN-Setup.exe
          retention-days: 7

      - name: SHA-256 of installer must equal its manifest (no drift)
        shell: pwsh
        run: |
          $raw = (Get-Content qa-stage\MAJIN-Setup.exe.sha256 -Raw).Trim()
          if ($raw -is [byte[]]) { $raw = [System.Text.Encoding]::UTF8.GetString($raw) }
          $want = ($raw -split '\s+')[0].ToLower()
          $have = (Get-FileHash qa-stage\MAJIN-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "published=$want computed=$have"
          if ($want -ne $have) { throw "SHA-256 mismatch for the published installer" }

      - name: Silent Inno install (the consumer path)
        shell: pwsh
        run: |
          # MÄTT (run 39422866759): Inno startar asynkront — utan -Wait mäts 'missing' direkt.
          $proc = Start-Process .\qa-stage\MAJIN-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install-silent.log' -Wait -PassThru
          "installer exit=$($proc.ExitCode)" 
          $exe = "$env:LOCALAPPDATA\Programs\MAJIN\majin-win-x64.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\MAJIN\majin-win-x64.exe" }
          if (-not (Test-Path $exe)) { throw "installed exe missing after silent install" }
          "installed at $exe ($((Get-Item $exe).Length) bytes)"

      - name: Install Ollama for Windows (real local LLM backend)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/ollama/ollama/releases/download/v0.12.6/ollama-windows-amd64.zip' -OutFile ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath ollama-win -Force
          echo "$((Get-Location).Path)\ollama-win" | Out-File -FilePath $env:GITHUB_PATH -Append
          $server = Start-Process -FilePath "$((Get-Location).Path)\ollama-win\ollama.exe" -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          $t0 = Get-Date
          $ok = $false
          while (((Get-Date) - $t0).TotalSeconds -lt 120) {
            try { $r = Invoke-WebRequest -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw 'ollama serve never answered /api/tags' }
          "ollama pid $($server.Id) up"

      - name: Pull small REAL models (1B + 0.5B capable + 135M negative probe)
        shell: pwsh
        run: |
          $models = @('llama3.2:1b','qwen2.5:0.5b','smollm2:135m')
          if ($env:QA_MODELS) { $models = $env:QA_MODELS -split ',' }
          foreach ($m in $models) {
            $m = $m.Trim()
            $done = $false
            for ($try = 1; $try -le 3 -and -not $done; $try++) {
              "pulling $m (attempt $try)…"
              $job = Start-Job -ScriptBlock {
                Set-Location $using:PWD
                & .\ollama-win\ollama.exe pull $using:m 2>&1 | Out-Null
                $LASTEXITCODE
              }
              $ok = Wait-Job $job -Timeout 300
              if ($ok -and ($job | Receive-Job)[-1] -eq 0) { $done = $true }
              else { Remove-Job $job -Force; "pull $m attempt $try timed out/failed"; Start-Sleep 3 }
            }
            if (-not $done) { throw "could not pull $m in 3 attempts" }
          }
          & ollama-win\ollama.exe list

          # R2 (real-world audit): on a hosted 4-vCPU/CPU-only runner the FIRST
          # completion per model can take minutes — load every model ONCE with a
          # 1-token warm-up and a generous timeout, holding it warm in memory.
          # Without this every chat-scenario hits cold-load and times out.
          # MÄTT (run 39424144421): llama3.2:1b svarade aldrig inom 420 s ×3 på
          # windows-latest CPU-runner — global throw på första modellen hade stoppat
          # hela mätningen trots att smollm2:135m hade kunnat bära audit-mekaniken.
          # Ärlig ordning: smallest → largest, minst en modell måste warma tydligt.
          $wOrder = @('smollm2:135m','qwen2.5:0.5b','llama3.2:1b')
          $warmed = @()
          # MÄTT (iter-6 avbruten 60+ min, iter-7 404 på llama + 3×420 s på både smollm2 & qwen):
          # hosted windows-latest CPU kan inte servera Ollama-modeller alls. Ärlig regel:
          # kort fönster per modell (90 s beräknskapskapskap för 1 token inom denna miljö);
          # misslyckas alla → mekanik-audit-läge, d-route-scenarier markeras AUTO-SKIP med
          # exakt orsak (aldrig maskerad och aldrig verifierad som fungerande).
          foreach ($mm in $wOrder) {
            "warming $mm (90 s fönster för 1 token — mätt tittats ärligt)…"
            $body = @{ model = $mm; messages = @(@{ role = 'user'; content = 'ok' }); stream = $false; keep_alive = '2m'; options = @{ num_predict = 1 } } | ConvertTo-Json -Depth 5
            $job = Start-Job -ScriptBlock {
              param($url, $b)
              try {
                $r = Invoke-RestMethod -Uri $url -Method Post -ContentType 'application/json' -Body $b -TimeoutSec 120
                @{ ok = $true }
              } catch { @{ ok = $false; err = $_.Exception.Message } }
            } -ArgumentList 'http://127.0.0.1:11434/api/chat', $body
            $wait = Wait-Job $job -Timeout 90 -ErrorAction SilentlyContinue
            if (-not $wait) { "  $mm kunde inte servera 1 token inom 90 s (CPU-frost)"; Remove-Job $job -Force; continue }
            $out = Receive-Job $job; Remove-Job $job -Force
            if ($out.ok) { $warmed += $mm; "  warm OK for $mm" } else { "  warm refused ${mm}: $($out.err)" }
          }
          if ($warmed.Count -eq 0) {
            "MECHANICS-ONLY: no model served within the measured window"
            Set-Content qa-stage\QA_WARM_MODELS "MECHANICS-ONLY"
          } else {
            Set-Content qa-stage\QA_WARM_MODELS ($warmed -join ',')
          }
        env:
          QA_MODELS: ${{ github.event.inputs.models }}

      - name: Run the 29-scenario REAL-WORLD audit against the installed product
        id: engine
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\MAJIN\majin-win-x64.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\MAJIN\majin-win-x64.exe" }
          $env:QA_EXE = $exe
          $env:QA_SETUP = "$PWD\qa-stage\MAJIN-Setup.exe"
          $env:QA_SETUP_SHA = "$PWD\qa-stage\MAJIN-Setup.exe.sha256"
          $env:QA_EVID = "$PWD\qa-evidence"
          $env:QA_MODELS = if (Test-Path qa-stage\QA_WARM_MODELS) { (Get-Content qa-stage\QA_WARM_MODELS -Raw).Trim() } elseif ($env:QA_MODELS_IN) { $env:QA_MODELS_IN } else { 'smollm2:135m,qwen2.5:0.5b,llama3.2:1b' }
          $env:QA_INTERACTIVE = '${{ github.event.inputs.qa_interactive }}'
          node --version
          node scripts/qa/qa-scenarios.mjs 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          QA_MODELS_IN: ${{ github.event.inputs.models }}
          QA_ARTIFACT: ${{ github.event.inputs.source == 'branch-build' && format('branch-build @{0}', github.sha) || format('published GitHub release v1.0.0 ({0})', github.sha) }}

      - name: Step summary (status table into the run page)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path qa-evidence\qa-report.json) {
            $rep = Get-Content qa-evidence\qa-report.json -Raw | ConvertFrom-Json
            "## MAJIN v1.0.0 REAL-WORLD QA (env: GitHub windows-latest, no interactive desktop)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "| Status | Count |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $rep.counts.PSObject.Properties | ForEach-Object { "| $($_.Name) | $($_.Value) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
            "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "| # | Scenario | Lane | Status | Note |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "|---|---|---|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            foreach ($s in $rep.scenarios) { "| $($s.id) | $($s.name) | $($s.lane) | $($s.status) | $(($s.note -replace '\|','\|').Substring(0,[Math]::Min(120,$s.note.Length))) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          } else { "qa-report.json missing — engine crashed before aggregate" | Out-File $env:GITHUB_STEP_SUMMARY -Append }

      - name: Upload per-scenario evidence + transcripts + server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-realworld-evidence
          path: qa-evidence/
          retention-days: 90

      - name: Audit verdict — FAILED scenarios turn the lane RED (by design)
        shell: pwsh
        run: |
          $rep = Get-Content qa-evidence\qa-report.json -Raw | ConvertFrom-Json
          $bad = @($rep.scenarios | Where-Object { $_.status -eq 'FAILED' })
          "counts: $($rep.counts | ConvertTo-Json -Compress)"
          if ($bad.Count -gt 0) {
            "FAILED: $($bad.id -join ', ')"
            exit 1
          }
          "no FAILED scenarios — lane green"

  qa-ui-browser:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: qa-realworld
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download + verify + silent-install the PUBLISHED v1.0.0
        if: ${{ github.event.inputs.source != 'branch-build' }}
        shell: pwsh
        run: |
          $rel = 'https://github.com/rssen-debug/MAJINCLI/releases/download/v1.0.0'
          New-Item -ItemType Directory -Force qa-stage | Out-Null
          Invoke-WebRequest "$rel/MAJIN-Setup.exe"        -OutFile qa-stage\MAJIN-Setup.exe
          Invoke-WebRequest "$rel/MAJIN-Setup.exe.sha256" -OutFile qa-stage\MAJIN-Setup.exe.sha256
          $want = ((Get-Content qa-stage\MAJIN-Setup.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLower()
          $have = (Get-FileHash qa-stage\MAJIN-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $have) { throw "SHA-256 mismatch" }
          $proc = Start-Process .\qa-stage\MAJIN-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "installer exit=$($proc.ExitCode)"

      - name: Fetch the installer built from THIS ref (branch-build lane)
        if: ${{ github.event.inputs.source == 'branch-build' }}
        uses: actions/download-artifact@v4
        with:
          name: branch-installer
          path: qa-stage

      - name: Ollama + one capable model
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/ollama/ollama/releases/download/v0.12.6/ollama-windows-amd64.zip' -OutFile ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath ollama-win -Force
          Start-Process -FilePath "$((Get-Location).Path)\ollama-win\ollama.exe" -ArgumentList 'serve' -WindowStyle Hidden | Out-Null
          $t0 = Get-Date; $ok = $false
          while (((Get-Date) - $t0).TotalSeconds -lt 120) {
            try { $r = Invoke-WebRequest 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw 'ollama serve down' }
          & ollama-win\ollama.exe pull llama3.2:1b | Out-Default
          & ollama-win\ollama.exe pull qwen2.5:0.5b | Out-Default

      - name: Playwright chromium
        shell: pwsh
        run: |
          npm install --no-save --no-audit playwright@1.48.2
          npx playwright install chromium

      - name: Aurora UI real-world lane (installed exe + real browser + real model)
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\MAJIN\majin-win-x64.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\MAJIN\majin-win-x64.exe" }
          $env:QA_EXE = $exe
          $env:QA_UI_EVID = "$PWD\qa-ui-evidence"
          node scripts/qa/qa-ui-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload UI evidence (screenshots + per-scenario JSON + server logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ui-evidence
          path: qa-ui-evidence/
          retention-days: 90

  qa-interactive:
    name: interactive desktop lane (self-hosted runner with real screen)
    needs: qa-realworld
    if: ${{ always() && github.event.inputs.runner == 'self-hosted' }}
    runs-on: [self-hosted, windows, interactive-desktop, majin-qa]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: "Fetch the branch-built installer from the artifact"
        uses: actions/download-artifact@v4
        with: { name: branch-installer, path: qa-stage }
      - name: Install silently ON THIS REAL DESKTOP (measured)
        shell: powershell
        run: |
          $proc = Start-Process .\qa-stage\MAJIN-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          $exe = "$env:LOCALAPPDATA\Programs\MAJIN\majin-win-x64.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\MAJIN\majin-win-x64.exe" }
          $n = 0; while (-not (Test-Path $exe) -and $n -lt 30) { Start-Sleep -Seconds 2; $n += 2 }
          if (-not (Test-Path $exe)) { throw "installed exe missing (exit=$($proc.ExitCode))" }
          "installed at $exe"
      - name: Verify this session IS interactive (honesty gate - c02 ready)
        shell: powershell
        run: |
          $b = [Environment]::UserInteractive
          "UserInteractive=$b"
          if (-not $b) { throw "interactive desktop check failed: UserInteractive=false; run run.cmd in a logged-on console, not as a service" }
      - name: Ollama + models (smallest-first on this real machine)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/ollama/ollama/releases/download/v0.12.6/ollama-windows-amd64.zip' -OutFile ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath ollama-win -Force
          Start-Process -FilePath "$((Get-Location).Path)\ollama-win\ollama.exe" -ArgumentList 'serve' -WindowStyle Hidden | Out-Null
          $t0 = Get-Date; $ok = $false
          while (((Get-Date) - $t0).TotalSeconds -lt 120) { try { $r = Invoke-WebRequest 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 2 } }
          if (-not $ok) { throw 'ollama serve down' }
          & ollama-win\ollama.exe pull smollm2:135m | Out-Default
          & ollama-win\ollama.exe pull qwen2.5:0.5b | Out-Default
      - name: Run interactive scenarios (c02-ready subset + control ops on real desktop)
        shell: powershell
        env:
          QA_INTERACTIVE: 'true'
          QA_MODELS: 'qwen2.5:0.5b,smollm2:135m'
          QA_ARTIFACT: ${{ format('interactive-selfhost @{0}', github.sha) }}
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\MAJIN\majin-win-x64.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\MAJIN\majin-win-x64.exe" }
          $env:QA_EXE = $exe; $env:QA_EVID = "$PWD\qa-evidence"
          node scripts/qa/qa-scenarios.mjs 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload interactive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-interactive-evidence, path: qa-evidence/, retention-days: 90 }

